name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 每周日凌晨 2 点运行完整测试
    - cron: '0 2 * * 0'

env:
  PYTHONUNBUFFERED: "1"
  HIVE_DASHBOARD_DEBUG: "true"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"

    - name: Run fast unit tests
      id: fast_tests
      run: |
        echo "=== Running Fast Unit Tests ==="
        pytest hive/tests/ -v -m "not slow and not integration" \
          --tb=short \
          --timeout=60 \
          -x
      continue-on-error: false

    - name: Run quick verification scripts
      id: quick_verify
      run: |
        echo "=== Running Quick Verification Scripts ==="
        
        # Phase 1/2
        python hive/tests/verify_phase1_2.py || echo "verify_phase1_2.py failed (non-critical)"
        
        # Phase 3
        python hive/tests/verify_phase3.py || echo "verify_phase3.py failed (non-critical)"
        
        # Phase 4
        python hive/tests/verify_phase4.py || echo "verify_phase4.py failed (non-critical)"
        
        # Phase 5
        python hive/tests/verify_phase5.py || echo "verify_phase5.py failed (non-critical)"
        
        # PRD UI
        python hive/tests/verify_prd_ui.py || echo "verify_prd_ui.py failed (non-critical)"
        
        # Memory Store
        python hive/tests/verify_memory_store_persistence.py || echo "verify_memory_store_persistence.py failed (non-critical)"
      continue-on-error: true

    - name: Run full tests (only on schedule or main)
      id: full_tests
      if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
      run: |
        echo "=== Running Full Test Suite ==="
        pytest hive/tests/ -v \
          --tb=short \
          --timeout=120 \
          --cov=hive \
          --cov-report=xml \
          --cov-report=term
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: steps.full_tests.outcome == 'success'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"
    
    - name: Run distributed tests
      run: |
        echo "=== Running Distributed Tests ==="
        python hive/scripts/run_distributed_test.py --test multi-node
    
    - name: Run persistence tests
      run: |
        echo "=== Running Persistence Tests ==="
        python hive/scripts/run_distributed_test.py --test persistence

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[docs]"
        pip install pdoc3
    
    - name: Generate API documentation
      run: |
        echo "=== Generating API Documentation ==="
        python hive/scripts/generate_api_docs.py --format md
    
    - name: Build Sphinx docs (if exists)
      run: |
        if [ -d "docs/source" ] && [ -f "docs/source/conf.py" ]; then
          echo "=== Building Sphinx Documentation ==="
          cd docs && make html
        else
          echo "Sphinx docs not configured, skipping"
        fi
      continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        echo "=== Building Docker Image ==="
        docker build -t hive-mind:latest .
    
    - name: Test Docker image
      run: |
        echo "=== Testing Docker Image ==="
        # 必须保持单行：run: | 块标量内出现顶格行会截断该块，令整个 workflow YAML 解析失败
        docker run --rm hive-mind:latest python -c "import sys; sys.path.insert(0, '/app'); from hive.core.dispatcher import HiveDispatcher, MessageBus; from hive.core.memory_store import MemoryStore; from hive.core.capability_gap_analyzer import CapabilityGapAnalyzer; from hive.core.multimodal_encoder import MultimodalEncoder; from hive.core.hive_federation import HiveFederation; print('All imports successful!'); print('Hive Docker image is working correctly.')"
