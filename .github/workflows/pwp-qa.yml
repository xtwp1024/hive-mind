# PWP-QA: 对 Hive 核心函数的 prompt 进行多宇宙质量检测
# mock 模式无需 API key, 每次 push/PR 自动运行
name: PWP-QA

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 手动触发 (用于真实 LLM 模式)

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pwp-qa-mock:
    name: PWP-QA (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pwp-qa (仓库内 vendor wheel, MIT)
        run: pip install ./vendor/pwp_qa-0.2.3-py3-none-any.whl tree-sitter tree-sitter-python

      - name: PWP-QA baseline (mock)
        run: pwp-qa baseline establish --backend mock -n 3

      - name: PWP-QA drift check (mock)
        run: pwp-qa baseline check --backend mock -n 3

      - name: PWP-QA trend
        run: pwp-qa trend --limit 10

  pwp-qa-real:
    name: PWP-QA (real LLM)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pwp-qa + openai (仓库内 vendor wheel, MIT)
        run: pip install ./vendor/pwp_qa-0.2.3-py3-none-any.whl openai tree-sitter tree-sitter-python

      - name: PWP-QA baseline (real LLM)
        run: pwp-qa baseline establish --backend openai -n 3

      - name: PWP-QA drift check (real LLM)
        run: pwp-qa baseline check --backend openai -n 3

      - name: PWP-QA trend
        run: pwp-qa trend --limit 20
