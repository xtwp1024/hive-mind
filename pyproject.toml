[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-mind"
version = "1.0.0"
description = "蜂巢项目 - 多AI协作智能系统"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jarvis AI System", email = "jarvis@hive.ai"}
]
keywords = [
    "ai",
    "multi-agent",
    "collaboration",
    "machine-learning",
    "distributed-systems"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "flake8>=6.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.22.0",
]
# R12：lint 工具钉版本，保证本地与 CI 用同一套格式/规则判定。
# 独立成 extras 的原因：isort 9.0.2 / mypy 2.4.1 的 Requires-Python >=3.10
# （实测 dist-info METADATA），塞进 dev 会让 test.yml 的 3.9 matrix 在
# Install dependencies 阶段直接失败。只由 lint.yml（Python 3.11）安装。
lint = [
    "black==24.10.0",
    "isort==9.0.2",
    "mypy==2.4.1",
    "ruff==0.17.4",
]

[project.scripts]
hive = "hive_mind:main"
hive-test = "test_brain_connection:main"

[project.urls]
Homepage = "https://github.com/antigravity/hive"
Documentation = "https://hive.readthedocs.io"
Repository = "https://github.com/antigravity/hive.git"
Issues = "https://github.com/antigravity/hive/issues"

[tool.setuptools]
packages = ["hive"]

[tool.setuptools.package-data]
hive = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | incubation/graveyard
)/
'''

[tool.isort]
profile = "black"
skip_glob = ["*/incubation/graveyard/*"]
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# R12：显式声明 ruff 门禁规则集（致命错误：语法错误 / f-string 格式 / 未定义名等）。
# 未声明时规则集会随 ruff 版本漂移，本地与 CI 的判定结果不可比。
# 历史风格类债务（F401/F541/E701 等）另立 P1-16 分批清理，不掩盖、不降级门禁。
[tool.ruff]
target-version = "py39"
exclude = ["hive/incubation/graveyard"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# mypy>=2 已不再接受 3.8 目标；与 CI lint job 的 3.11 对齐，取 3.10 为下限
python_version = "3.10"
exclude = ["hive/incubation/graveyard/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["hive/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["hive"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
